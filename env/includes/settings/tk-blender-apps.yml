includes:
- ../app_locations.yml
- ./tk-multi-workfiles2.yml

################################################################################
# shared entity browser definition used by workfiles2 (same as Maya / Nuke)

_blender_workfiles_entities: &blender_workfiles_entities
- caption: Assets
  entity_type: Asset
  hierarchy: [sg_asset_type, code]
  filters:
    - [ sg_status_list, not_in, ['bid', 'omt', 'hld', 'otr'] ]
  sub_hierarchy:
    entity_type: Task
    filters:
      - [ sg_status_list, not_in, ['bid', 'omt', 'hld', 'otr'] ]
    link_field: entity
    hierarchy: [step]
- caption: Shots
  entity_type: Shot
  filters:
    - [ sg_status_list, not_in, ['bid', 'omt', 'hld', 'otr'] ]
  hierarchy: [sg_sequence.Sequence.episode, sg_sequence.Sequence.code, code]
  sub_hierarchy:
    entity_type: Task
    filters:
      - [ sg_status_list, not_in, ['bid', 'omt', 'hld', 'otr'] ]
    link_field: entity
    hierarchy: [step]

################################################################################
# ---- app settings for Blender

# ---- workfiles2
settings.tk-multi-workfiles2.blender.launch_at_startup:
  launch_at_startup: true
  entities: *blender_workfiles_entities
  hook_scene_operation: "{engine}/tk-multi-workfiles2/scene_operation_tk-blender.py"
  location: "@apps.tk-multi-workfiles2.location"

settings.tk-multi-workfiles2.blender.asset_step:
  template_publish: blender_asset_publish
  template_publish_area: asset_publish_area
  template_work: blender_asset_work
  template_work_area: asset_work_area_blender
  entities: *blender_workfiles_entities
  my_tasks_extra_display_fields: [sg_status_list, step]
  my_tasks_filters:
    - [ sg_status_list, not_in, ['bid', 'omt', 'hld', 'otr', 'sap', 'apr', 'psu', 'pcl'] ]
    - [ task_assignees, is, '{context.user}']
  allow_task_creation: False
  hook_scene_operation: "{engine}/tk-multi-workfiles2/scene_operation_tk-blender.py"
  location: "@apps.tk-multi-workfiles2.location"

settings.tk-multi-workfiles2.blender.shot_step:
  template_publish: blender_shot_publish
  template_publish_area: shot_publish_area
  template_work: blender_shot_work
  template_work_area: shot_work_area_blender
  entities: *blender_workfiles_entities
  my_tasks_extra_display_fields: [sg_status_list, step]
  my_tasks_filters:
    - [ sg_status_list, not_in, ['bid', 'omt', 'hld', 'otr', 'sap', 'apr', 'psu', 'pcl'] ]
    - [ task_assignees, is, '{context.user}']
  allow_task_creation: False
  hook_scene_operation: "{engine}/tk-multi-workfiles2/scene_operation_tk-blender.py"
  location: "@apps.tk-multi-workfiles2.location"

# ---- snapshot
settings.tk-multi-snapshot.blender.asset_step:
  template_snapshot: blender_asset_snapshot
  template_work: blender_asset_work
  hook_scene_operation: "{engine}/tk-multi-snapshot/scene_operation_tk-blender.py"
  location: "@apps.tk-multi-snapshot.location"

settings.tk-multi-snapshot.blender.shot_step:
  template_snapshot: blender_shot_snapshot
  template_work: blender_shot_work
  hook_scene_operation: "{engine}/tk-multi-snapshot/scene_operation_tk-blender.py"
  location: "@apps.tk-multi-snapshot.location"

# ---- loader
settings.tk-multi-loader2.blender:
  actions_hook: '{engine}/tk-multi-loader2/tk-blender_actions.py'
  action_mappings:
    Alembic Cache: [import]
    Alembic Camera: [import]
    Abc File: [import]
    FBX Camera: [import]
    Unreal FBX: [import]
    Dae File: [import]
    Collada File: [import]
    Obj File: [import]
    Ply File: [import]
    Stl File: [import]
    Glb File: [import]
    Gltf File: [import]
    Blender Project File: [link, append]
    Blender Scene: [link, append]
    Hiero Audio: [asSequencerSound]
    Wav File: [asSequencerSound]
    Sound File: [asSequencerSound]
    Movie File: [asSequencerMovie, asCompositorNodeMovieClip]
    Image File: [asSequencerImage, asCompositorNodeImage]
    Texture File: [asSequencerImage, asCompositorNodeImage]
    Image: [asSequencerImage, asCompositorNodeImage]
    Texture: [asSequencerImage, asCompositorNodeImage]
    Rendered Image: [asSequencerImage, asCompositorNodeImage]
    Photoshop Image: [asSequencerImage, asCompositorNodeImage]
    PRECOMP: [asSequencerImage, asCompositorNodeImage]
    TECH_PRECOMP: [asSequencerImage, asCompositorNodeImage]
    BG_MATTEPAINT: [asSequencerImage, asCompositorNodeImage]
    IMAGE_PLANE: [asSequencerImage, asCompositorNodeImage]
    HIERO PLATE: [asSequencerImage, asCompositorNodeImage]
    PARAFX Plate: [asSequencerImage, asCompositorNodeImage]
    VREF Hiero: [asSequencerMovie, asCompositorNodeMovieClip]
    RENDER_MAYA: [asSequencerImage, asCompositorNodeImage]
    RENDER_NUKE: [asSequencerImage, asCompositorNodeImage]
    ALPHA RENDER: [asSequencerImage, asCompositorNodeImage]
  entities:
  - caption: Current_Shot
    entity_type: Task
    filters:
      - [ project, is, '{context.project}' ]
      - [ entity, is, '{context.entity}' ]
      - [ sg_status_list, not_in, [ 'bid',  'omt', 'otr', 'hld' ] ]
    hierarchy: [ content ]
  - caption: Assets
    entity_type: Asset
    filters:
      - [ project, is, "{context.project}" ]
      - [ sg_status_list, not_in, [ 'bid',  'omt', 'otr', 'hld' ] ]
    hierarchy: [ sg_asset_type, code ]
  - caption: Library - Assets
    entity_type: Asset
    filters:
      - [ linked_projects, is, "{context.project}" ]
    hierarchy: [ project.Project.name, sg_asset_type, code ]
  - caption: Shots
    entity_type: Shot
    filters:
      - [ project, is, "{context.project}" ]
      - [ sg_status_list, not_in, ['bid',  'omt', 'otr', 'hld'] ]
    hierarchy: [ sg_sequence, code ]
  location: "@apps.tk-multi-loader2.location"

# ---- publish2
settings.tk-multi-publish2.blender.asset_step:
  collector: "{self}/collector.py:{engine}/tk-multi-publish2/basic/collector.py"
  collector_settings:
      Work Template: blender_asset_work
  publish_plugins:
  - name: Begin file versioning
    hook: "{engine}/tk-multi-publish2/basic/start_version_control.py"
    settings: {}
  - name: Publish Session to Shotgun
    hook: "{self}/publish_file.py:{engine}/tk-multi-publish2/basic/publish_session.py"
    settings:
        Publish Template: blender_asset_publish
  - name: Publish Alembic Geometry to Shotgun
    hook: "{self}/publish_file.py:{engine}/tk-multi-publish2/basic/publish_session_geometry.py"
    settings:
        Publish Template: blender_asset_geometry_publish
  help_url: "https://help.autodesk.com/view/SGSUB/ENU/?guid=SG_Supervisor_Artist_sa_integrations_sa_integrations_user_guide_html#the-publisher"
  location: "@apps.tk-multi-publish2.location"

settings.tk-multi-publish2.blender.shot_step:
  collector: "{self}/collector.py:{engine}/tk-multi-publish2/basic/collector.py"
  collector_settings:
      Work Template: blender_shot_work
  publish_plugins:
  - name: Begin file versioning
    hook: "{engine}/tk-multi-publish2/basic/start_version_control.py"
    settings: {}
  - name: Publish Session to Shotgun
    hook: "{self}/publish_file.py:{engine}/tk-multi-publish2/basic/publish_session.py"
    settings:
        Publish Template: blender_shot_publish
  - name: Publish Alembic Geometry to Shotgun
    hook: "{self}/publish_file.py:{engine}/tk-multi-publish2/basic/publish_session_geometry.py"
    settings:
        Publish Template: blender_shot_geometry_publish
  help_url: "https://help.autodesk.com/view/SGSUB/ENU/?guid=SG_Supervisor_Artist_sa_integrations_sa_integrations_user_guide_html#the-publisher"
  location: "@apps.tk-multi-publish2.location"

# ---- breakdown (legacy app; ships a Blender hook with the engine)
settings.tk-multi-breakdown.blender:
  hook_scene_operations: '{engine}/tk-multi-breakdown/tk-blender_scene_operations.py'
  location: "@apps.tk-multi-breakdown.location"

# ---- set frame range
settings.tk-multi-setframerange.blender:
  hook_frame_operation: "{engine}/tk-multi-setframerange/frame_operations_tk-blender.py"
  location: "@apps.tk-multi-setframerange.location"

